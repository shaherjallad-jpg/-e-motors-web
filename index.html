<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E MOTORS - The Automotive Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #000; color: #fff; }
        .hero { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; background: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2000&auto=format&fit=crop') no-repeat center center/cover; }
        .hero::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: 1; }
        .hero-content { position: relative; z-index: 10; max-width: 800px; }
        .gold-text { color: #D4AF37; font-weight: bold; }
        h1 { font-size: 2.5rem; margin: 15px 0; text-transform: uppercase; }
        p { color: #ccc; font-size: 1rem; margin-bottom: 30px; }
        .btn { position: relative; z-index: 20; display: inline-block; background: #D4AF37; color: #000; padding: 15px 30px; border-radius: 10px; font-weight: bold; text-decoration: none; text-transform: uppercase; cursor: pointer; }
        .section { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        .card { position: relative; height: 300px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); text-decoration: none; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; background-size: cover; background-position: center; }
        .card::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 1; }
        .card > * { position: relative; z-index: 5; }
        .card h3 { font-size: 1.3rem; margin-top: 5px; text-transform: uppercase; }
        .card-btn { display: inline-block; background: #D4AF37; color: #000; padding: 8px 15px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; text-decoration: none; margin-top: 10px; }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <span class="gold-text">WELCOME TO E MOTORS</span>
            <h1>THE AUTOMOTIVE ECOSYSTEM</h1>
            <p>The all-in-one platform for everything automotive. Explore, buy, finance, and connect globally.</p>
            <a href="car-details.html" class="btn">Start Exploring</a>
        </div>
    </section>

    <section class="section">
        <div class="section-title">
            <h2>CHOOSE YOUR JOURNEY</h2>
        </div>

        <div class="grid">
            <a href="car-details.html" class="card" style="background-image: url('https://images.unsplash.com/photo-1617814076367-b759c7d7e738?q=80&w=1000&auto=format&fit=crop');">
                <h3>NEW CARS</h3>
                <span class="card-btn">ENTER</span>
            </a>
            <a href="car-details.html" class="card" style="background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1000&auto=format&fit=crop');">
                <h3>USED CARS</h3>
                <span class="card-btn">ENTER</span>
            </a>
        </div>
    </section>

</body>
</html>
